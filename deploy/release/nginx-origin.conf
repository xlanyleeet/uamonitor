# Install in the HOST nginx config, beside the gradient-mc.com and wiki blocks.
# cloudflare-real-ip.conf must list ONLY current Cloudflare source CIDRs.
server {
    listen 443 ssl;
    server_name monitoring.gradient-mc.com;
    ssl_certificate /etc/cloudflare/fullchain.pem;
    ssl_certificate_key /etc/cloudflare/privkey.key;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    location ^~ /moderation/ {
        access_log off;
        proxy_pass http://127.0.0.1:9013;
    }
    location / {
        proxy_pass http://127.0.0.1:9013;
    }
}
